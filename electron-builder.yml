appId: com.nadal.hanabisurvivors
productName: Hanabi Survivors
copyright: Copyright © 2026 Nadal

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true

extraResources:
  - from: src/renderer/src/audio/bgm.mp3
    to: bgm.mp3

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Hanabi Survivors
  uninstallDisplayName: Hanabi Survivors
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: HanabiSurvivors-Setup-${version}.${ext}

portable:
  artifactName: HanabiSurvivors-Portable-${version}.${ext}
